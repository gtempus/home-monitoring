[project]
name = "power-monitor"
version = "0.1.0"
description = "Raspberry Pi power monitor: watches a GPIO pin and reports state."
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.7",
    "mypy>=1.13",
    "poethepoet>=0.48.0",
]

# Pi-only deps, installed explicitly on the target hardware.
# See [project.optional-dependencies].pi below.
[project.scripts]
power-monitor = "power_monitor.entrypoints.cron:main"

[project.optional-dependencies]
pi = [
    "note-python>=2.0",
    "python-periphery>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/power_monitor"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/power_monitor", "tests"]
explicit_package_bases = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"

[[tool.mypy.overrides]]
module = ["gpiod", "gpiod.*", "notecard", "notecard.*", "periphery", "periphery.*"]
ignore_missing_imports = true

[tool.poe.tasks]
format = "ruff format src tests"
lint = "ruff check --fix src tests"
lint-check = "ruff check src tests"
typecheck = "mypy"
test = "pytest"

check = ["format", "lint", "typecheck", "test"]
check-check = ["lint-check", "typecheck", "test"]

[tool.pytest.ini_options]
markers = [
    "hardware: requires real hardware (GPIO, system, etc.)",
]
